<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four — Minimax AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>CONNECT FOUR</h1>
  <!-- LED score readout -->
  <div class="readout">
    <div class="score you"><span class="label">YOU</span><span class="num" id="scoreYou">00</span></div>
    <span class="vs">VS</span>
    <div class="score cpu"><span class="label">CPU</span><span class="num" id="scoreCpu">00</span></div>
  </div>

  <div class="controls">
    <div class="seg" id="difficulty" role="group" aria-label="Difficulty">
      <button type="button" data-value="easy">EASY</button>
      <button type="button" data-value="medium" aria-pressed="true">MED</button>
      <button type="button" data-value="hard">HARD</button>
    </div>
    <button id="reset" type="button">NEW GAME</button>
  </div>

  <div id="status">INSERT DISC</div>
  <div class="board" id="board" aria-label="Connect Four board"></div>

  <script src="/static/game.js"></script>
</body>
</html>
